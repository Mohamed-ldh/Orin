<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orin - Se connecter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Milonga&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      body{
        background-image: url(../img/7621bb6087ee02d1c51a38663c88e6b0.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: 'Inter', serif;
      }
      .adjust1{
        width: 35%;
        height: 100vh;
      }
      .adjustment{
        margin-bottom: 15px;
        margin-left: 10px;
        width: 500px;
        border:1px solid black;
        padding: 15px;
        border-top-color: transparent;
        border-right-color: transparent;
        border-left-color: transparent;
        border-radius: 0px;
        background-color: transparent;
        color: rgb(72, 72, 72);
        font-weight: 500;
      }

      .space{
        margin-top: 16px;
      }
      .adjustment:focus{
        margin-left: 10px;
        outline: none;
        box-shadow: 0 0 0px #ffffff00;
        border:1px solid black;
        border-top-color: transparent;
        border-right-color: transparent;
        border-left-color: transparent;
        background-color: transparent;
      }
      #t1{
        font-weight: 700;
        margin-top: 80px;
        margin-left: 80px;
      }
      #t2{
        color: gray;
        font-weight: 400;
        margin-top: 30px;
        margin-left: 80px;
        margin-bottom: 80px;
      }
      .lab{
        font-weight: bold;
      }
    </style>
</head>
<body>
    <div class="bg-light adjust1">
        <div class="text-warning ps-5 pt-5"><h1>Orin</h1></div>
        <h2 id="t1">Bienvenue de retour</h2>
        <p id="t2">Veuillez entrer vos informations</p>
        <div class="row bg-light" style="font-family: 'Inter', serif; padding-bottom: 160px; width: 45%; background-color: transparent;">
            <div class="col-lg-6" style="background-color: rgba(98, 98, 98, 0);  padding-right: 0px; margin-left: 80px;">
              <form action="/login" method="post">
                <label for="" class="lab">Adresse e-mail</label><br>
                <input type="email" name="email" required placeholder="E-mail" class="space adjustment form-control" ><br>
                <label for="" class="lab">Mot de passe</label><br>
                <input type="password" name="pw" required placeholder="Mot de passe" class="form-control space adjustment">
                <button class="btn btn-outline-warning bg-warning text-light me-5 txt-center" style="width: 440px; font-weight: 600; font-size: 15px; border-radius: 14px; margin-bottom: 25px;margin-left: 40px; margin-top: 30px;" type="submit">Se connecter</button>
                <p style="width: 360px; margin-left: 90px;">Vous n'avez pas de compte? <span><a href="signup.html" class="text-warning">Inscrivez-vous</a></span></p>
              </form>
            </div>
        </div>

    </div>
    



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
